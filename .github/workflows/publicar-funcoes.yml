# Publica as funções do Supabase sempre que o código delas muda no GitHub (ou quando rodado à mão em Actions).
# Precisa do segredo SUPABASE_ACCESS_TOKEN em Settings → Secrets and variables → Actions.
name: Publicar funções no Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "supabase/acessos.sql"
      - ".github/workflows/publicar-funcoes.yml"
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: bbpwibqysasqopiqelvd
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Conferir a chave de acesso
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o segredo SUPABASE_ACCESS_TOKEN no GitHub (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      # As duas funções conferem sozinhas quem é membro e a assinatura da Nuvemshop, por isso sem verificação de JWT do Supabase
      - name: Publicar nuvemshop
        run: supabase functions deploy nuvemshop --project-ref "$PROJECT_REF" --no-verify-jwt --yes

      - name: Publicar planilha
        run: supabase functions deploy planilha --project-ref "$PROJECT_REF" --no-verify-jwt --yes

      # Leitura de documentos com IA (aba Adicionar documentos); confere sozinha se quem chama é membro
      # Recebe os PDFs do e-mail de contas (Gmail → Apps Script); confere a senha EMAIL_TOKEN
      - name: Publicar email-docs
        run: supabase functions deploy email-docs --project-ref "$PROJECT_REF" --no-verify-jwt --yes

      - name: Publicar ler-comprovante
        run: supabase functions deploy ler-comprovante --project-ref "$PROJECT_REF" --no-verify-jwt --yes

      # Regras de acesso do banco (perfis completo / só pedidos). Seguro rodar de novo.
      # Se a chave do GitHub não tiver permissão de banco, rode supabase/acessos.sql à mão no SQL Editor do Supabase.
      - name: Aplicar regras de acesso
        continue-on-error: true
        run: |
          jq -Rs '{query: .}' supabase/acessos.sql > /tmp/q.json
          code=$(curl -sS -o /tmp/r.txt -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json)
          echo "HTTP $code"; head -c 400 /tmp/r.txt; echo
          test "$code" -lt 300
