<style>
/* Layout: ateliê ledger — nav de abas no topo, conteúdo em colunas que viram uma só no celular */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --sunken:#ECEEF3; --ink:#1A1C25; --ink2:#474B5C; --muted:#777B8E; --line:#DFE1E8;
  --accent:#33459E; --accent-ink:#FFFFFF; --accent-soft:#E5E8F6;
  --good:#1D7448; --good-soft:#E1F1E8; --warn:#9A6200; --warn-soft:#F7EDD9; --bad:#AD3434; --bad-soft:#F7E3E3;
  --neg:#BF5A3C;
  --f-display:"Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111319; --surface:#1A1D26; --sunken:#151820; --ink:#ECEDF3; --ink2:#B5B8C9; --muted:#878BA0; --line:#2B2F3C;
  --accent:#8E9CF0; --accent-ink:#111319; --accent-soft:#252B4B;
  --good:#5DC48E; --good-soft:#18352A; --warn:#E3AA45; --warn-soft:#3A2E16; --bad:#EF7D7D; --bad-soft:#3D1F22;
  --neg:#E58C6E; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111319; --surface:#1A1D26; --sunken:#151820; --ink:#ECEDF3; --ink2:#B5B8C9; --muted:#878BA0; --line:#2B2F3C;
  --accent:#8E9CF0; --accent-ink:#111319; --accent-soft:#252B4B;
  --good:#5DC48E; --good-soft:#18352A; --warn:#E3AA45; --warn-soft:#3A2E16; --bad:#EF7D7D; --bad-soft:#3D1F22;
  --neg:#E58C6E; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num,td.n,.kpi .v{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:700}
h2{font-size:20px;letter-spacing:-.01em}
h3{font-size:15px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:24px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.brand span{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.month{display:flex;align-items:center;gap:4px}
.month input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;min-width:0}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;cursor:pointer;display:grid;place-items:center}
.ib:hover{background:var(--sunken)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:10px 14px;color:var(--ink2);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}

main{padding-block:24px 64px}
section.view{display:flex;flex-direction:column;gap:20px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--sunken)}
a.btn{color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}
a.btn.pri{color:var(--accent-ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel > h3{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--ink2)}
.kpi .v.pos{color:var(--good)} .kpi .v.negv{color:var(--bad)}
.meter{height:6px;background:var(--sunken);border-radius:3px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* tables */
.tw{overflow-x:auto;margin:0 -2px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunken)}
.sub{color:var(--muted);font-size:12px}
tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0}

/* DRE */
.dre td{padding:7px 4px}
.dre tr.tot td{font-weight:700;border-top:1px solid var(--ink2)}
.dre tr.minus td:first-child{color:var(--ink2);padding-left:14px}
.dre tr.big td{font-family:var(--f-display);font-size:17px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunken);color:var(--ink2);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
select.st{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px;font-size:12px}

.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:16px;margin-bottom:4px}
.note{font-size:13px;color:var(--ink2);background:var(--sunken);border-radius:8px;padding:10px 12px}
.banner{border-radius:8px;padding:10px 14px;font-size:13px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--accent-soft);color:var(--accent)}

/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;min-width:170px;transform:translate(-50%,-100%);font-variant-numeric:tabular-nums;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.tip b{display:block;margin-bottom:2px}
.tip span{display:flex;justify-content:space-between;gap:12px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(15,17,25,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:620px;padding:22px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
@media (max-width:520px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font-size:12px;font-weight:600;color:var(--ink2)}
.f input,.f select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.f input[type=checkbox]{width:auto}
.f .h{font-size:11px;color:var(--muted)}
.files{display:flex;flex-direction:column;gap:6px;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:10px}
.att{display:flex;align-items:center;gap:8px;font-size:13px}
.att a,.doclink{color:var(--accent);text-decoration:none;word-break:break-all}
.att a:hover,.doclink:hover{text-decoration:underline}
.files input[type=file]{font-size:13px;max-width:100%}
.doclink{font-size:12px;display:inline-block;margin-right:8px}
tr.grp td{background:var(--sunken);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 10px}
.lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:12px;font-weight:600}
.lnk:hover{text-decoration:underline}
select.flt{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;max-width:100%}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border:2px dashed var(--line);border-radius:var(--r);padding:28px 16px;background:var(--surface);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-family:var(--f-display);font-size:18px}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.fila{display:flex;flex-direction:column;gap:14px}
.fitem{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
@media (max-width:600px){.fitem{grid-template-columns:minmax(0,1fr)}}
.prev{width:100%;aspect-ratio:3/4;max-width:100%;border-radius:8px;background:var(--sunken);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-weight:700;font-size:13px}
.prev img{width:100%;height:100%;object-fit:cover}
@media (max-width:600px){.prev{aspect-ratio:auto;height:90px}}
.fbody{display:flex;flex-direction:column;gap:12px;min-width:0}
.ftop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ftop .fn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.ia{font-size:13px;color:var(--ink2);background:var(--sunken);border-radius:8px;padding:8px 10px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;vertical-align:-2px;margin-right:6px}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ccard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;min-width:0}
.ccard:hover{border-color:var(--ink2)}
.ccard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cnum{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}
.calc{display:flex;flex-wrap:wrap;gap:8px 18px;background:var(--sunken);border-radius:8px;padding:10px 12px;font-size:13px}
.calc b{font-variant-numeric:tabular-nums}
.mact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mact .sp{margin-right:auto}
.err{color:var(--bad);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:30;font-size:13px}
.qlist{display:flex;flex-direction:column}
.qi{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.qi:last-child{border-bottom:0}
.qi .grow{flex:1;min-width:0}
.qi .grow div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:.6}}}
</style>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><b>Seille</b><span>Gestão do ateliê</span></div>
      <div class="month">
        <button class="ib" id="mprev" aria-label="Mês anterior">‹</button>

  <div class="panel empty" id="boot"><b>Carregando os dados do ateliê…</b>Pedidos, peças, custos e anúncios aparecem aqui assim que a base responder.</div>
</main>

<script>
(() => {
// ---------- helpers ----------
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BRL = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const brl = n => BRL.format(+n || 0);
const brlK = n => Math.abs(n) >= 10000 ? "R$ " + (n/1000).toLocaleString("pt-BR",{maximumFractionDigits:1}) + " mil" : brl(n);
const pct = (n, d=1) => isFinite(n) ? (n*100).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d}) + "%" : "—";
const intf = n => (+n||0).toLocaleString("pt-BR");
const num = v => { const x = +v; return isFinite(x) ? x : 0; };
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const MESESF = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const ymLabel = ym => { const [y,m] = ym.split("-"); return MESESF[+m-1] + " de " + y; };
const ymShort = ym => { const [y,m] = ym.split("-"); return MESES[+m-1] + "/" + y.slice(2); };
const addYm = (ym, d) => { let [y,m] = ym.split("-").map(Number); m += d; while(m<1){m+=12;y--} while(m>12){m-=12;y++} return y + "-" + String(m).padStart(2,"0"); };
const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const dBR = s => s ? s.split("-").reverse().join("/") : "";
const addDays = (s, n) => { const d = new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const daysBetween = (a, b) => Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00"))/86400000);
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }

// ---------- domain ----------
const ORIGENS = ["Meta Ads","Google Ads","TikTok Ads","Pinterest Ads","Influenciadores","Instagram orgânico","Busca orgânica","Indicação","WhatsApp","Direto / outros"];
const PLATAFORMAS = ["Meta Ads","Google Ads","TikTok Ads","Pinterest Ads","Influenciadores"];
const STATUS = ["Recebido","Em produção","Pronto","Enviado","Entregue","Cancelado"];
const STATUS_CLS = {"Recebido":"", "Em produção":"acc", "Pronto":"warn", "Enviado":"good", "Entregue":"good", "Cancelado":"bad"};
// Plano de contas: grupo → categorias. "Funcionárias" e "Tráfego pago" vêm das próprias abas.
const GRUPOS = [
  ["Estrutura do ateliê", ["Aluguel","Condomínio","IPTU","Energia elétrica","Água","Internet e telefone","Seguros"], "fixos"],
  ["Pessoas", ["Funcionárias","Pró-labore"], "fixos"],
  ["Produção", ["Manutenção de máquinas","Peça piloto e modelagem","Tecido / estoque","Embalagens em lote","Material de limpeza e escritório"], "variaveis"],
  ["Administrativo", ["Contador","Plataforma do e-commerce","Softwares e apps","Taxas bancárias","Empréstimos e financiamentos"], "fixos"],
  ["Marketing", ["Tráfego pago","Lançamento de coleções","Fotos e conteúdo","Brindes e mimos"], "variaveis"],
  ["Outros", ["Outros"], "variaveis"],
];
const CAT_AUTO = {"Funcionárias":"funcionarias", "Tráfego pago":"trafego", "Lançamento de coleções":"colecoes"};
const CATS = GRUPOS.flatMap(g => g[1]).filter(c => !CAT_AUTO[c]);
const CAT_FIXO = CATS, CAT_VAR = CATS;
const CFG_DEF = {taxaGateway:4.99, imposto:6, margemAlvo:55, metaFaturamento:15000};
const FUNCOES = ["Costureira","Modelista","Cortadeira","Auxiliar de produção","Passadeira / acabamento","Atendimento e expedição","Outra"];
const VINCULOS = ["CLT","MEI / PJ","Por peça (facção)","Diarista","Freelancer"];
const TIPOS_PAG = ["Salário","Adiantamento / vale","Produção por peça","Hora extra","Diária","13º salário","Férias","Rescisão","INSS / FGTS / encargos","Vale-transporte","Bônus / comissão","Outros"];
const POR_PECA = "Produção por peça";
const FORMAS = ["Pix","Transferência","Dinheiro","Boleto / guia"];
const COLS = ["produtos","vendas","fixos","variaveis","trafego","funcionarias","pagamentos","colecoes","custosColecao"];
const CAT_COL = ["Fotógrafo","Vídeo maker","Modelos","Maquiagem e cabelo","Locação do espaço","Styling e produção de moda","Cenografia e objetos","Transporte","Alimentação","Edição e tratamento de imagens","Peças piloto do lançamento","Divulgação do lançamento","Outros"];
const STATUS_COL = ["Planejamento","Em produção","Lançada","Encerrada"];
const STATUS_COL_CLS = {"Planejamento":"", "Em produção":"acc", "Lançada":"good", "Encerrada":""};
let COLSEL = "";
const NLOAD = COLS.length + 1;

const S = {colecoes:[], custosColecao:[], produtos:[], vendas:[], fixos:[], variaveis:[], trafego:[], funcionarias:[], pagamentos:[], config:{...CFG_DEF}, loaded:new Set(), db:null, assets:null, readonly:false};
let PAGF = "";
let MES = today().slice(0,7);

const custoPeca = p => num(p.tecidoMetros)*num(p.tecidoPrecoMetro) + num(p.aviamentos) + num(p.costura) + num(p.embalagem) + num(p.outros);
const taxaPct = () => (num(S.config.taxaGateway) + num(S.config.imposto))/100;
function pecaCalc(p){
  const c = custoPeca(p), pr = num(p.preco), tx = pr*taxaPct();
  const mc = pr - c - tx;
  const alvo = num(S.config.margemAlvo)/100;
  const den = 1 - alvo - taxaPct();
  return {custo:c, taxas:tx, mc, mcPct: pr ? mc/pr : NaN, markup: c ? pr/c : NaN, sugerido: den > 0 ? c/den : NaN};
}
function vendaCalc(v){
  const receita = num(v.precoUnit)*num(v.qtd) - num(v.desconto) + num(v.freteCobrado);
  const cpv = num(v.custoUnit)*num(v.qtd);
  const taxas = receita*taxaPct();
  return {receita, cpv, taxas, frete:num(v.fretePago), lucro: receita - cpv - taxas - num(v.fretePago)};
}
const ativa = v => v.status !== "Cancelado";
const fixoNoMes = (f, ym) => (!f.inicio || f.inicio <= ym) && (!f.fim || f.fim >= ym);

function calcMes(ym){
  const vs = S.vendas.filter(v => (v.data||"").slice(0,7) === ym && ativa(v));
  let receita=0,cpv=0,taxas=0,frete=0,descontos=0,bruto=0,pecas=0;
  const pedidos = new Set();
  for(const v of vs){ const c = vendaCalc(v); receita+=c.receita; cpv+=c.cpv; taxas+=c.taxas; frete+=c.frete; descontos+=num(v.desconto); bruto+=num(v.precoUnit)*num(v.qtd)+num(v.freteCobrado); pecas+=num(v.qtd); pedidos.add(v.pedido || v.id); }
  const mc = receita - cpv - taxas - frete;
  const ads = S.trafego.filter(t => (t.data||"").slice(0,7) === ym).reduce((a,t)=>a+num(t.investimento),0);
  const avulsos = S.variaveis.filter(x => (x.data||"").slice(0,7) === ym).reduce((a,x)=>a+num(x.valor),0);
  const fixos = S.fixos.filter(f => fixoNoMes(f, ym)).reduce((a,f)=>a+num(f.valor),0);
  const pags = S.pagamentos.filter(p => pagYm(p) === ym);
  const porPeca = pags.filter(p => p.tipo === POR_PECA).reduce((a,p)=>a+num(p.valor),0);
  const equipe = pags.reduce((a,p)=>a+num(p.valor),0) - porPeca;
  const colecao = S.custosColecao.filter(x => (x.data||"").slice(0,7) === ym).reduce((a,x)=>a+num(x.valor),0);
  const lucro = mc - ads - avulsos - fixos - equipe - colecao;
  const nPed = pedidos.size;
  const receitaAds = vs.filter(v => PLATAFORMAS.includes(v.origem)).reduce((a,v)=>a+vendaCalc(v).receita,0);
  const mcPct = receita ? mc/receita : NaN;
  return {ym, vs, receita, bruto, descontos, cpv, taxas, frete, mc, mcPct, ads, avulsos, fixos, equipe, porPeca, colecao, lucro, margem: receita ? lucro/receita : NaN,
    nPed, pecas, ticket: nPed ? receita/nPed : 0, roas: ads ? receitaAds/ads : NaN, cac: nPed ? ads/nPed : NaN,
    equilibrio: mcPct > 0 ? (fixos + ads + avulsos + equipe + colecao)/mcPct : NaN};
}
const pagYm = p => p.competencia || (p.data||"").slice(0,7);
// Soma por categoria no mês (fixos vigentes + variáveis + abas automáticas)
function custosPorCategoria(ym, c){
  const m = {};
  const add = (k, v) => { k = k || "Outros"; m[k] = (m[k]||0) + num(v); };
  S.fixos.filter(f => fixoNoMes(f, ym)).forEach(f => add(f.categoria, f.valor));
  S.variaveis.filter(x => (x.data||"").slice(0,7) === ym).forEach(x => add(x.categoria, x.valor));
  m["Funcionárias"] = c.equipe; m["Tráfego pago"] = c.ads; m["Lançamento de coleções"] = c.colecao;
  return m;
}

let modalEl = null;
function closeModal(){ if(modalEl){ modalEl.remove(); modalEl=null; } }
function openForm(col, doc, preset){
  closeModal();
  const sc = SCHEMAS[col];
  const base = doc ? {...doc} : {...(typeof sc.defaults === "function" ? sc.defaults() : (sc.defaults||{})), ...(preset||{})};
  modalEl = document.createElement("div");
  modalEl.className = "ov";
  const fieldsHtml = sc.fields.map(f => {
    const id = "f_" + f.key, v = base[f.key];
    let inp;
    if(f.type === "select") inp = `<select id="${id}" name="${f.key}">${f.opts().map(([k,l])=>`<option value="${esc(k)}"${String(v??"")===String(k)?" selected":""}>${esc(l)}</option>`).join("")}</select>`;
    else if(f.type === "files") inp = `<div class="files" id="${id}">${(v||[]).map((a,i)=>`<label class="att"><input type="checkbox" data-keep="${i}" checked> <a href="#" data-blob="${esc(a.id)}">${esc(a.nome||"arquivo")}</a></label>`).join("")}${(v||[]).length?`<span class="h">Desmarque para remover um comprovante.</span>`:""}${S.assets?`<input type="file" name="novosAnexos" multiple accept="image/*,application/pdf"><span class="h">Fotos ou PDF do comprovante (até 20 MB cada)</span>`:`<span class="h">Para anexar comprovantes é preciso estar conectado.</span>`}</div>`;
    else if(f.type === "checkbox") inp = `<input type="checkbox" id="${id}" name="${f.key}"${(v ?? f.def) ? " checked":""}>`;
    else inp = `<input id="${id}" name="${f.key}" type="${f.type}"${f.step?` step="${f.step}"`:""}${f.min?` min="${f.min}"`:""}${f.req?" required":""} value="${esc(v ?? "")}"${f.type==="number"?' inputmode="decimal"':""}>`;
    return `<div class="f${f.wide?" wide":""}"><label for="${id}">${esc(f.label)}</label>${inp}${f.h?`<span class="h">${esc(f.h)}</span>`:""}</div>`;
  }).join("");
  modalEl.innerHTML = `<form class="modal" novalidate>
    <h2>${doc ? "Editar" : "Novo"}: ${esc(sc.title.toLowerCase())}</h2>
    <div class="fgrid">${fieldsHtml}</div>
    <div class="calc" id="calc" hidden></div>
    <div class="err" id="ferr" hidden></div>
    <div class="mact">
      ${doc ? `<button type="button" class="btn danger sp" id="fdel">Excluir</button>` : ""}
      <button type="button" class="btn" id="fcancel">Cancelar</button>
      <button type="submit" class="btn pri">${doc ? "Salvar alterações" : "Adicionar"}</button>
    </div></form>`;
  document.body.appendChild(modalEl);
  const form = $("form", modalEl);
  const read = () => {
    const o = {};
    for(const f of sc.fields){
      if(f.type === "files") continue;
      const el = form.elements[f.key];
      if(f.type === "checkbox") o[f.key] = el.checked;
      else if(f.type === "number") o[f.key] = el.value === "" ? null : num(el.value);
      else o[f.key] = el.value;
    }
    return o;
  };
  const live = () => {
    const o = read(), box = $("#calc", modalEl);
    if(col === "produtos"){
      const c = pecaCalc(o); box.hidden = false;
      box.innerHTML = `<span>Custo da peça <b>${brl(c.custo)}</b></span><span>Markup <b>${isFinite(c.markup)?c.markup.toLocaleString("pt-BR",{maximumFractionDigits:2})+"×":"—"}</b></span><span>Margem de contribuição <b>${brl(c.mc)} · ${pct(c.mcPct)}</b></span><span>Preço para ${num(S.config.margemAlvo)}% de margem <b>${isFinite(c.sugerido)?brl(c.sugerido):"—"}</b></span>`;
    } else if(col === "vendas"){
      const c = vendaCalc(o); box.hidden = false;
      box.innerHTML = `<span>Receita <b>${brl(c.receita)}</b></span><span>Custo das peças <b>${brl(c.cpv)}</b></span><span>Taxas e impostos <b>${brl(c.taxas)}</b></span><span>Sobra do pedido <b>${brl(c.lucro)}</b></span>`;
    } else if(col === "trafego"){
      box.hidden = false;
      box.innerHTML = `<span>CPC <b>${o.cliques ? brl(num(o.investimento)/o.cliques) : "—"}</b></span><span>CTR <b>${o.impressoes ? pct(num(o.cliques)/o.impressoes,2) : "—"}</b></span>`;
    }
  };
  form.addEventListener("input", live);
  if(col === "vendas"){
    form.elements.produtoId.addEventListener("change", e => {
      const p = S.produtos.find(p => p.id === e.target.value);
      if(p){ form.elements.precoUnit.value = num(p.preco); form.elements.custoUnit.value = Math.round(custoPeca(p)*100)/100; live(); }
    });
  }
  if(col === "pagamentos"){
    form.elements.funcionariaId.addEventListener("change", e => {
      const f = S.funcionarias.find(f => f.id === e.target.value);
      if(f && !form.elements.valor.value && form.elements.tipo.value === "Salário" && num(f.salario)) form.elements.valor.value = num(f.salario);
    });
  }
  live();
  $("#fcancel", modalEl).onclick = closeModal;
  modalEl.addEventListener("mousedown", e => { if(e.target === modalEl) closeModal(); });
  const del = $("#fdel", modalEl);
  if(del) del.onclick = async () => {
    if(col === "colecoes" && S.custosColecao.some(x => x.colecaoId === doc.id)){ const el = $("#ferr", modalEl); el.hidden = false; el.textContent = "Esta coleção tem custos lançados. Exclua os custos antes de excluir a coleção."; return; }
    if(!del.classList.contains("arm")){ del.classList.add("arm"); del.textContent = "Confirmar exclusão"; return; }
    del.disabled = true;
    try{ await S.db.collection(col).doc(doc.id).delete(); closeModal(); toast("Excluído");
      if(S.assets) for(const a of (doc.anexos||[])) S.assets.delete(a.id).catch(()=>{}); }
    catch(e){ showErr(e); del.disabled = false; }
  };
  const showErr = e => { const el = $("#ferr", modalEl); el.hidden = false; el.textContent = e?.code === "invalid_argument" ? "Sua conta não tem permissão para salvar. Peça para incluir seu e-mail na lista de membros." : "Não foi possível salvar agora. Tente de novo em instantes."; };
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const o = read();
    const miss = sc.fields.filter(f => f.req && (o[f.key] === "" || o[f.key] === null));
    if(miss.length){ const el = $("#ferr", modalEl); el.hidden = false; el.textContent = "Preencha: " + miss.map(f=>f.label).join(", ") + "."; return; }
    if(col === "vendas"){ const p = S.produtos.find(p => p.id === o.produtoId); o.produtoNome = p ? p.nome : (doc?.produtoNome || ""); if(o.precoUnit === null && p) o.precoUnit = num(p.preco); if(o.custoUnit === null && p) o.custoUnit = custoPeca(p); }
    if(!S.db){ showErr({}); return; }
    const btn = $("button[type=submit]", form); btn.disabled = true;
    let removidos = [];
    if(col === "custosColecao"){ o.colecaoNome = S.colecoes.find(c => c.id === o.colecaoId)?.nome || ""; }
    if(col === "pagamentos"){
      const f = S.funcionarias.find(f => f.id === o.funcionariaId); o.funcionariaNome = f ? f.nome : (doc?.funcionariaNome || "");
      if(!o.competencia) o.competencia = (o.data||"").slice(0,7);
    }
    if(sc.fields.some(f => f.type === "files")){
      const antigos = doc?.anexos || [];
      const keep = antigos.filter((a,i) => form.querySelector(`[data-keep="${i}"]`)?.checked);
      removidos = antigos.filter(a => !keep.includes(a));
      const novos = form.elements.novosAnexos?.files ? [...form.elements.novosAnexos.files] : [];
      for(const file of novos){
        btn.textContent = "Enviando " + file.name + "…";
        try{ const r = await S.assets.upload(file); keep.push({id:r.id, nome:file.name, tipo:r.contentType}); }
        catch(err){ const el = $("#ferr", modalEl); el.hidden = false; el.textContent = `Não foi possível enviar "${file.name}". Use foto (JPG, PNG) ou PDF de até 20 MB.`; btn.disabled = false; btn.textContent = doc ? "Salvar alterações" : "Adicionar"; return; }
      }
      o.anexos = keep;
    }
    try{
      if(doc){ const body = {...doc, ...o}; delete body.id; await S.db.collection(col).doc(doc.id).set(body); }
      else { o.criadoEm = new Date().toISOString(); await S.db.collection(col).add(o); }
      closeModal(); toast(doc ? "Alterações salvas" : "Adicionado");
      if(S.assets) for(const a of removidos) S.assets.delete(a.id).catch(()=>{});
    }catch(err){ showErr(err); btn.disabled = false; }
  });
  setTimeout(() => form.elements[sc.fields[0].key]?.focus(), 30);
}

function chartLucro(){
  const months = Array.from({length:6},(_,i)=>addYm(MES,i-5)).map(calcMes);
  const W=640,H=230,pl=56,pr=8,pt=14,pb=28;
  const vals = months.map(m=>m.lucro);
  let max = Math.max(0,...vals), min = Math.min(0,...vals);
  if(max===min){ max = 1000; }
  const step = niceStep((max-min)/4);
  max = Math.ceil(max/step)*step; min = Math.floor(min/step)*step;
  const y = v => pt + (max - v)/(max-min)*(H-pt-pb);
  const bw = (W-pl-pr)/months.length;
  let g = "";
  for(let v=min; v<=max+1e-9; v+=step){
    g += `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${v===0?1.5:1}" ${v===0?'':'stroke-dasharray="2 4"'}/>`;
    g += `<text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${v===0?"0":(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil"}</text>`;
  }
  const bars = months.map((m,i)=>{
    const x = pl + i*bw + bw*0.22, w = bw*0.56, y0 = y(0), y1 = y(m.lucro), r = Math.min(4, Math.abs(y1-y0));
    const pos = m.lucro >= 0, cur = m.ym === MES;
    const fill = pos ? "var(--accent)" : "var(--neg)";
    const h = Math.abs(y1-y0);
    const path = h < 0.5 ? "" : pos
      ? `M${x},${y0} V${y1+r} Q${x},${y1} ${x+r},${y1} H${x+w-r} Q${x+w},${y1} ${x+w},${y1+r} V${y0} Z`
      : `M${x},${y0} V${y1-r} Q${x},${y1} ${x+r},${y1} H${x+w-r} Q${x+w},${y1} ${x+w},${y1-r} V${y0} Z`;
    return `<g data-i="${i}"><rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}" fill="transparent"/>${path?`<path d="${path}" fill="${fill}" opacity="${cur?1:.55}"/>`:""}
      <text x="${x+w/2}" y="${H-8}" text-anchor="middle" style="${cur?"fill:var(--ink);font-weight:600":""}">${ymShort(m.ym)}</text></g>`;
  }).join("");
  return {svg:`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Lucro líquido dos últimos 6 meses">${g}${bars}</svg>`, months, W};
}
function niceStep(raw){ if(raw<=0) return 1000; const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }

function bindChart(){
  const box = $("#chart"); if(!box) return;
  const tip = $("#tip"); const {months, W} = chartLucro();
  const show = (g) => {
    const m = months[+g.dataset.i]; const r = g.getBoundingClientRect(), br = box.getBoundingClientRect();
    tip.hidden = false;
    tip.innerHTML = `<b>${ymLabel(m.ym)}</b><span>Faturamento <i>${brl(m.receita)}</i></span><span>Custos totais <i>${brl(m.receita-m.lucro)}</i></span><span>Lucro <i>${brl(m.lucro)}</i></span>`;
    let left = r.left - br.left + r.width/2; left = Math.max(95, Math.min(br.width-95, left));
    tip.style.left = left + "px"; tip.style.top = "8px";
  };
  box.querySelectorAll("g[data-i]").forEach(g => { g.addEventListener("mouseenter", ()=>show(g)); g.addEventListener("click", ()=>show(g)); });

}

const PDFJS = "vendor/pdfjs/";

const loadScript = src => new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = rej; document.head.appendChild(el); });
async function getPdfjs(){
  if(!window.pdfjsLib){ await loadScript(PDFJS + "pdf.min.js"); await loadScript(PDFJS + "pdf.worker.min.js"); }
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js";
  return window.pdfjsLib;
}
const canvasBlob = cv => new Promise(r => cv.toBlob(r, "image/jpeg", 0.85));
async function prepImage(file){
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width*k); cv.height = Math.round(bmp.height*k);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  return canvasBlob(cv);
}
async function prepPdf(file){
  const lib = await getPdfjs();
  const pdf = await lib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
  let text = "";
  for(let i = 1; i <= Math.min(pdf.numPages, 3); i++){ const tc = await (await pdf.getPage(i)).getTextContent(); text += tc.items.map(t => t.str).join(" ") + "\n"; }
  const page = await pdf.getPage(1);
  const vp0 = page.getViewport({scale:1}); const vp = page.getViewport({scale: Math.min(2.5, 1600 / vp0.width)});
  const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height;
  const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,cv.width,cv.height);
  await page.render({canvasContext: ctx, viewport: vp}).promise;
  const img = await canvasBlob(cv);
  return {text: text.replace(/\s+/g," ").trim(), img};
}

Funcionárias cadastradas (id: nome):
${fs}

Coleções cadastradas (id: nome | status | lançamento):

- Guia de INSS, FGTS, DAE ou eSocial de funcionária: destino "funcionaria", tipoPagamento "INSS / FGTS / encargos".

${text ? `Texto extraído do arquivo "${nome}":\n"""\n${text.slice(0,15000)}\n"""` : `O documento está na imagem anexa (arquivo "${nome}").`}`;

function normaliza(r){
  r = (r && typeof r === "object") ? r : {};
  const o = {
    tipoDocumento: String(r.tipoDocumento||"documento"), destino: ["funcionaria","colecao","variavel","fixo","trafego","ignorar"].includes(r.destino) ? r.destino : "variavel",
    descricao: String(r.descricao||""), favorecido: String(r.favorecido||""), valor: num(r.valor), data: /^\d{4}-\d{2}-\d{2}$/.test(r.data||"") ? r.data : today(),
    pago: r.pago !== false, competencia: /^\d{4}-\d{2}$/.test(r.competencia||"") ? r.competencia : "",
    funcionariaId: S.funcionarias.some(f=>f.id===r.funcionariaId) ? r.funcionariaId : "",
    tipoPagamento: TIPOS_PAG.includes(r.tipoPagamento) ? r.tipoPagamento : "Salário", formaPagamento: FORMAS.includes(r.formaPagamento) ? r.formaPagamento : "Pix",
    categoria: CATS.includes(r.categoria) ? r.categoria : "Outros", fixoId: S.fixos.some(f=>f.id===r.fixoId) ? r.fixoId : "",
    colecaoId: S.colecoes.some(c=>c.id===r.colecaoId) ? r.colecaoId : (S.colecoes.find(c=>c.status!=="Encerrada")?.id || ""), categoriaColecao: CAT_COL.includes(r.categoriaColecao) ? r.categoriaColecao : "Outros",
    plataforma: PLATAFORMAS.includes(r.plataforma) ? r.plataforma : "Meta Ads", confianca: Math.max(0, Math.min(1, num(r.confianca))), observacao: String(r.observacao||""),
  };
  if(!o.competencia) o.competencia = o.data.slice(0,7);
  if(o.destino === "funcionaria" && !o.funcionariaId && o.favorecido) o.funcionariaId = "__novo";
  if(o.destino === "fixo" && !o.fixoId) o.destino = "variavel";
  if(o.destino === "colecao" && !S.colecoes.length) o.destino = "variavel";
  return o;
}
const ERR_IA = {not_granted:"A leitura automática não está liberada para esta conta.", rate_limited:"Muitas leituras ao mesmo tempo. Aguarde um minuto e toque em Tentar de novo.", images_unavailable:"Esta visualização não aceita imagens. Envie o PDF original do comprovante.", image_rejected:"A imagem não pôde ser lida. Tente uma foto em JPG ou PNG."};
let lendo = false;
async function processaFila(){
  if(lendo) return; lendo = true;
  try{
    let it;
    while((it = S.fila.find(x => x.status === "aguardando"))){
      it.status = "lendo"; render();
      try{
        if(!S.sample) throw {code:"sem_ia"};
        let text = "", img = null;
        if(it.file.type === "application/pdf" || /\.pdf$/i.test(it.file.name)){ const r = await prepPdf(it.file); text = r.text.length >= 80 ? r.text : ""; img = r.img; it.thumb = URL.createObjectURL(r.img); }
        else if(it.file.type.startsWith("image/")) img = await prepImage(it.file);
        else throw {code:"tipo"};
        const opts = {modelTier:"default"};
        if(!text){ if(!S.sampleImg) throw {code:"images_unavailable"}; opts.images = [img]; }
        it.sug = normaliza(await S.sample.json(promptFor(it.file.name, text), opts));
        it.status = "pronto";
      }catch(e){
        it.status = "erro";
        it.err = e?.code === "sem_ia" ? "A leitura automática não está disponível. Verifique a internet ou a configuração da função ler-comprovante." : e?.code === "tipo" ? "Envie foto (JPG, PNG) ou PDF." : (ERR_IA[e?.code] || "Não foi possível ler este arquivo. Tente de novo ou lance manualmente.");
      }
      render();
    }
  } finally { lendo = false; }
}

}

  if(g.destino === "variavel"){ const fx = S.fixos.find(f => f.categoria === g.categoria && fixoNoMes(f, g.competencia)); if(fx) out.push(`Já existe o custo fixo "${fx.nome}" nesta categoria. Lançar como custo do mês vai contar duas vezes; prefira "Comprovante de custo fixo".`); }
  if(g.destino === "funcionaria" && g.funcionariaId && S.pagamentos.some(p => p.funcionariaId === g.funcionariaId && Math.abs(num(p.valor)-g.valor) < 0.01 && p.data === g.data)) out.push("Já existe um pagamento igual (mesma pessoa, valor e data).");
  if(g.destino === "variavel" && S.variaveis.some(x => Math.abs(num(x.valor)-g.valor) < 0.01 && x.data === g.data)) out.push("Já existe um custo do mês com o mesmo valor e data.");
  if(g.destino === "fixo"){ const fx = S.fixos.find(f=>f.id===g.fixoId); if(fx && (fx.comprovantes?.[g.competencia]||[]).length) out.push(`"${fx.nome}" já tem comprovante em ${ymShort(g.competencia)}.`); }
  return out;
}
function cardLeitor(it){
  const prev = `<div class="prev">${it.thumb ? `<img src="${it.thumb}" alt="">` : "PDF"}</div>`;
  const head = (pill) => `<div class="ftop"><span class="fn">${esc(it.file.name)}</span>${pill}</div>`;
  if(it.status === "aguardando" || it.status === "lendo") return `<div class="fitem">${prev}<div class="fbody">${head(`<span class="pill acc">${it.status==="lendo"?"lendo":"na fila"}</span>`)}<div class="ia"><span class="spin"></span>${it.status==="lendo" ? "O Claude está lendo o documento. Leva de 10 a 40 segundos." : "Aguardando a leitura dos arquivos anteriores."}</div></div></div>`;
  if(it.status === "erro") return `<div class="fitem">${prev}<div class="fbody">${head(`<span class="pill bad">não lido</span>`)}<div class="err">${esc(it.err)}</div><div class="mact"><button class="btn" data-rm="${it.id}">Remover</button><button class="btn pri" data-retry="${it.id}">Tentar de novo</button></div></div></div>`;
  if(it.status === "salvo") return `<div class="fitem">${prev}<div class="fbody">${head(`<span class="pill good">lançado</span>`)}<div class="ia">${esc(it.msg)}</div><div class="mact"><button class="btn" data-rm="${it.id}">Tirar da lista</button></div></div></div>`;
  const g = it.sug, k = it.id;
  const sel = (key, label, opts, wide) => `<div class="f${wide?" wide":""}"><label for="${k}_${key}">${label}</label><select id="${k}_${key}" data-fk="${key}" data-it="${k}">${opts.map(([v,l])=>`<option value="${esc(v)}"${String(g[key])===String(v)?" selected":""}>${esc(l)}</option>`).join("")}</select></div>`;
  const inp = (key, label, type, wide) => `<div class="f${wide?" wide":""}"><label for="${k}_${key}">${label}</label><input id="${k}_${key}" data-fk="${key}" data-it="${k}" type="${type}"${type==="number"?' step="0.01" inputmode="decimal"':""} value="${esc(g[key])}"></div>`;
  let campos = sel("destino","Lançar como",DEST,true);
  if(g.destino !== "ignorar"){
    if(g.destino === "funcionaria"){
      const opts = [["","Escolha"], ...S.funcionarias.map(f=>[f.id,f.nome])]; if(g.favorecido) opts.push(["__novo", `Cadastrar "${g.favorecido}" como nova funcionária`]);
      campos += sel("funcionariaId","Funcionária",opts) + sel("tipoPagamento","Tipo",TIPOS_PAG.map(x=>[x,x])) + sel("formaPagamento","Forma",FORMAS.map(x=>[x,x]));
    }
    if(g.destino === "variavel") campos += sel("categoria","Categoria",CATS.map(x=>[x,x]));
    if(g.destino === "colecao") campos += sel("colecaoId","Coleção",[["","Escolha"],...S.colecoes.map(c=>[c.id,c.nome])]) + sel("categoriaColecao","Categoria",CAT_COL.map(x=>[x,x]));
    if(g.destino === "fixo") campos += sel("fixoId","Custo fixo",[["","Escolha"],...S.fixos.map(f=>[f.id,`${f.nome} (${brl(f.valor)})`])]);
    if(g.destino === "trafego") campos += sel("plataforma","Plataforma",PLATAFORMAS.map(x=>[x,x]));
    campos += inp("valor","Valor (R$)","number") + inp("data","Data","date") + inp("competencia","Mês de referência","month") + inp("descricao","Descrição","text", true);
  }
  const conf = g.confianca >= .8 ? ["good","confiança alta"] : g.confianca >= .5 ? ["warn","confira com atenção"] : ["bad","confiança baixa"];
  const av = avisos(it);
  return `<div class="fitem">${prev}<div class="fbody">
    ${head(`<span class="pill ${conf[0]}">${conf[1]}</span>`)}
    <div class="ia"><b>${esc(g.tipoDocumento)}</b>${g.favorecido?` · pago a <b>${esc(g.favorecido)}</b>`:""} · ${brl(g.valor)} em ${dBR(g.data)}${g.observacao?`<br>${esc(g.observacao)}`:""}</div>
    ${av.map(a=>`<div class="banner warn">${esc(a)}</div>`).join("")}
    <div class="fgrid">${campos}</div>
    <div class="err" id="err_${k}" hidden></div>
    <div class="mact"><button class="btn" data-rm="${k}">Descartar</button>${g.destino==="ignorar"?"":`<button class="btn pri" data-ok="${k}">Confirmar e lançar</button>`}</div>
  </div></div>`;
}
async function confirmaLeitor(id, btn){
  const it = S.fila.find(x => x.id === id); if(!it || !S.db) return;
  const g = it.sug, errEl = $("#err_"+id);
  const fail = m => { errEl.hidden = false; errEl.textContent = m; btn.disabled = false; btn.textContent = "Confirmar e lançar"; };
  if(!(g.valor > 0)) return fail("Informe o valor.");
  if(g.destino === "funcionaria" && !g.funcionariaId) return fail("Escolha a funcionária.");
  if(g.destino === "fixo" && !g.fixoId) return fail("Escolha o custo fixo.");
  if(g.destino === "colecao" && !g.colecaoId) return fail("Escolha a coleção.");
  btn.disabled = true; btn.textContent = "Salvando…";
  let anexos = [];
  if(S.assets){ try{ const r = await S.assets.upload(it.file); anexos = [{id:r.id, nome:it.file.name, tipo:r.contentType}]; } catch(e){ return fail("Não foi possível guardar o arquivo. Use JPG, PNG ou PDF de até 20 MB."); } }
  const comp = g.competencia || g.data.slice(0,7), base = {criadoEm:new Date().toISOString(), lidoPorIA:true};
  try{
    if(g.destino === "funcionaria"){
      let fid = g.funcionariaId, fnome;
      if(fid === "__novo"){ const ref = await S.db.collection("funcionarias").add({nome:g.favorecido, funcao:"Costureira", vinculo:"CLT", salario:0, ativa:true, admissao:"", pix:"", telefone:"", criadoEm:base.criadoEm}); fid = ref.id; fnome = g.favorecido; }
      else fnome = S.funcionarias.find(f=>f.id===fid)?.nome || "";
      await S.db.collection("pagamentos").add({...base, data:g.data, competencia:comp, funcionariaId:fid, funcionariaNome:fnome, tipo:g.tipoPagamento, valor:g.valor, forma:g.formaPagamento, obs:g.descricao, anexos});
      it.msg = `Pagamento de ${brl(g.valor)} para ${fnome} lançado em Funcionárias.`;
    } else if(g.destino === "colecao"){
      const cn = S.colecoes.find(c=>c.id===g.colecaoId)?.nome || "";
      await S.db.collection("custosColecao").add({...base, colecaoId:g.colecaoId, colecaoNome:cn, categoria:g.categoriaColecao, fornecedor:g.favorecido, data:g.data, descricao:g.descricao, valor:g.valor, pago:g.pago, anexos});
      it.msg = `${brl(g.valor)} lançado na coleção ${cn} (${g.categoriaColecao}).`;
    } else if(g.destino === "variavel"){
      await S.db.collection("variaveis").add({...base, data:g.data, categoria:g.categoria, descricao:g.descricao || g.tipoDocumento, valor:g.valor, anexos});
      it.msg = `${brl(g.valor)} lançado em Custos do mês (${g.categoria}).`;
    } else if(g.destino === "fixo"){
      const fx = S.fixos.find(f=>f.id===g.fixoId); const body = {...fx}; delete body.id;
      const cp = {...(fx.comprovantes||{})}; cp[comp] = [...(cp[comp]||[]), ...anexos.map(a=>({...a, valor:g.valor, data:g.data}))];
      body.comprovantes = cp; await S.db.collection("fixos").doc(fx.id).set(body);
      it.msg = `Comprovante de ${ymShort(comp)} anexado ao custo fixo "${fx.nome}".${Math.abs(num(fx.valor)-g.valor) > 0.01 ? ` O valor pago (${brl(g.valor)}) difere do cadastrado (${brl(fx.valor)}); ajuste o custo fixo se o valor mudou.` : ""}`;
    } else if(g.destino === "trafego"){
      await S.db.collection("trafego").add({...base, data:g.data, plataforma:g.plataforma, campanha:g.descricao, investimento:g.valor, impressoes:null, cliques:null, anexos});
      it.msg = `${brl(g.valor)} lançado em Tráfego pago (${g.plataforma}).`;
    }
    if(!S.assets) it.msg += " O arquivo não foi guardado.";
    it.status = "salvo"; render();
  }catch(e){ fail(e?.code === "invalid_argument" ? "Você tem acesso só de leitura." : "Não foi possível lançar agora. Tente de novo."); }
}

$("#mes").addEventListener("change", e => { if(e.target.value){ MES = e.target.value; render(); } });
$("#mprev").onclick = () => { MES = addYm(MES,-1); render(); };
$("#mnext").onclick = () => { MES = addYm(MES,1); render(); };
window.addEventListener("hashchange", render);
$("#mes").value = MES;
render();

// ---------- data ----------
(async () => {
  const timer = setTimeout(() => { if(S.loaded.size < NLOAD){ S.failed = "Os dados ainda não carregaram. Verifique a conexão; o app continua tentando."; render(); } }, 10000);
  let db = null;
  try{ db = await window.claude?.use?.("db"); }catch(e){}
  if(!db){ clearTimeout(timer); S.failed = "Não foi possível conectar ao banco de dados. Verifique a internet e recarregue o app."; S.loaded = new Set(COLS.concat('config')); render(); return; }
  S.db = db;
  window.claude.use("assets").then(a => { S.assets = a; }).catch(()=>{});
  window.claude.use("sample").then(async sm => { S.sample = sm; S.sampleImg = sm ? (await sm.limits().catch(()=>null))?.images || null : null; if(curView()==="leitor") render(); }).catch(()=>{});
  const done = k => { if(!S.loaded.has(k)){ S.loaded.add(k); if(S.loaded.size >= NLOAD){ clearTimeout(timer); if(S.failed && S.failed.startsWith("Os dados ainda")) S.failed = null; } } };
  for(const col of COLS){
    db.collection(col).onSnapshot(snap => {
      S[col] = snap.docs.map(d => ({id:d.id, ...d.data()}));
      if(!snap.metadata.fromCache) done(col);
      else if(S.loaded.size < NLOAD) done(col);
      render();
    }, err => { done(col); S.failed = "Parte dos dados não pôde ser carregada. Recarregue a página mais tarde."; render(); });
  }
  db.doc("config/geral").onSnapshot(snap => {
    S.config = {...CFG_DEF, ...(snap.exists ? snap.data() : {})};
    done("config"); render();
  }, err => { done("config"); render(); });
})();
})();
</script>
